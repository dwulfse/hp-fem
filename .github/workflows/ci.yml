name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      # Catch2 is fetched at configure time, so caching it keeps CI quick
      - name: Cache Catch2
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: catch2-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # the solver reads meshes by relative path, so it runs from main/
      - name: Run the solver
        working-directory: main
        run: ./FEM

  warnings:
    name: no warnings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      # the build is warning free under -Wall -Wextra and should stay that way
      - name: Build with warnings as errors
        run: |
          cmake -B build -S . -DFEM_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build -j
